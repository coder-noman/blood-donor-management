<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Need Blood - Blood Donation Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
    <span id="welcomeMsg">Need Blood</span>
    <div>
        <a href="dashboard.html" style="color:white; margin-right:15px;">My Dashboard</a>
        <button id="logoutBtn">Logout</button>
    </div>
</div>

<div class="container wide">
    <h2>Find a Donor</h2>
    <p>Search all registered donors by blood group or name. Contact details are shown so you can reach out directly.</p>

    <div id="msg"></div>

    <form id="searchForm" class="form-row" style="align-items:flex-end;">
        <div style="flex:1">
            <label>Blood Group</label>
            <select id="searchBloodGroup">
                <option value="">All</option>
                <option>A+</option><option>A-</option>
                <option>B+</option><option>B-</option>
                <option>AB+</option><option>AB-</option>
                <option>O+</option><option>O-</option>
            </select>
        </div>
        <div style="flex:1">
            <label>Name</label>
            <input type="text" id="searchName" placeholder="Search by name">
        </div>
        <div style="flex:1">
            <button type="submit">Search</button>
        </div>
    </form>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Blood Group</th>
                <th>Last Donation</th>
                <th>Phone</th>
                <th>Address</th>
            </tr>
        </thead>
        <tbody id="donorsTableBody"></tbody>
    </table>
</div>

<script src="js/needblood.js"></script>
</body>
</html>
