<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - Blood Donation Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
    <span id="welcomeMsg">Admin Panel</span>
    <div>
        <a href="need-blood.html" style="color:white; margin-right:15px;">🩸 Need Blood</a>
        <a href="dashboard.html" style="color:white; margin-right:15px;">My Dashboard</a>
        <button id="logoutBtn">Logout</button>
    </div>
</div>

<div class="container wide">
    <h2>All Registered Users</h2>

    <div id="msg"></div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Age</th>
                <th>Blood Group</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Last Donation</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="usersTableBody"></tbody>
    </table>
</div>

<!-- Edit modal (simple inline form, no fancy popup library) -->
<div class="container" id="editBox" style="display:none;">
    <h2>Edit User</h2>
    <form id="editForm">
        <input type="hidden" id="editId">

        <label>Full Name</label>
        <input type="text" id="editName" required>

        <div class="form-row">
            <div style="flex:1">
                <label>Age</label>
                <input type="number" id="editAge">
            </div>
            <div style="flex:1">
                <label>Blood Group</label>
                <select id="editBloodGroup">
                    <option value="">Select</option>
                    <option>A+</option><option>A-</option>
                    <option>B+</option><option>B-</option>
                    <option>AB+</option><option>AB-</option>
                    <option>O+</option><option>O-</option>
                </select>
            </div>
        </div>

        <label>Phone</label>
        <input type="text" id="editPhone">

        <label>Address</label>
        <input type="text" id="editAddress">

        <label>Last Donation Date</label>
        <input type="date" id="editLastDonation">

        <button type="submit">Save Changes</button>
        <button type="button" class="btn-secondary" id="cancelEditBtn">Cancel</button>
    </form>
</div>

<script src="js/admin.js"></script>
</body>
</html>
