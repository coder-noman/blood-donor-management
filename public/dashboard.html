<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Dashboard - Blood Donation Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
    <span id="welcomeMsg">Welcome</span>
    <div>
        <a href="need-blood.html" style="color:white; margin-right:15px;">🩸 Need Blood</a>
        <a href="admin.html" id="adminLink" style="display:none; color:white; margin-right:15px;">Admin Panel</a>
        <button id="logoutBtn">Logout</button>
    </div>
</div>

<div class="container">
    <h2>My Details</h2>

    <div id="msg"></div>

    <form id="profileForm">
        <label>Full Name</label>
        <input type="text" id="name" required>

        <div class="form-row">
            <div style="flex:1">
                <label>Age</label>
                <input type="number" id="age">
            </div>
            <div style="flex:1">
                <label>Blood Group</label>
                <select id="blood_group">
                    <option value="">Select</option>
                    <option>A+</option><option>A-</option>
                    <option>B+</option><option>B-</option>
                    <option>AB+</option><option>AB-</option>
                    <option>O+</option><option>O-</option>
                </select>
            </div>
        </div>

        <label>Phone</label>
        <input type="text" id="phone">

        <label>Address</label>
        <input type="text" id="address">

        <label>Last Donation Date</label>
        <input type="date" id="last_donation_date">

        <button type="submit">Update My Details</button>
    </form>
</div>

<script src="js/dashboard.js"></script>
</body>
</html>
